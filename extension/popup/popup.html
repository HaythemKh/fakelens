<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1>🔍 FakeLens</h1>
      <p class="popup-subtitle">Détecteur d'images IA</p>
    </div>

    <div class="popup-status">
      <div class="status-item">
        <span class="status-label">Backend:</span>
        <span class="status-value" id="backend-status">
          <span class="status-dot"></span>
          Vérification...
        </span>
      </div>
      <div class="status-item">
        <span class="status-label">Modèle:</span>
        <span class="status-value" id="model-status">
          <span class="status-dot"></span>
          Non chargé
        </span>
      </div>
    </div>

    <div class="popup-section">
      <h2>⚙️ Paramètres</h2>
      
      <div class="setting-group">
        <label for="threshold-low">Seuil "Réel" (< valeur)</label>
        <input type="range" id="threshold-low" min="0" max="1" step="0.05" value="0.3">
        <span class="threshold-value" id="threshold-low-value">0.30</span>
      </div>

      <div class="setting-group">
        <label for="threshold-high">Seuil "Généré" (> valeur)</label>
        <input type="range" id="threshold-high" min="0" max="1" step="0.05" value="0.7">
        <span class="threshold-value" id="threshold-high-value">0.70</span>
      </div>

      <div class="setting-group">
        <label>
          <input type="checkbox" id="auto-gradcam">
          Grad-CAM automatique
        </label>
      </div>

      <button id="save-settings" class="btn-primary">Enregistrer</button>
    </div>

    <div class="popup-section">
      <h2>📊 Historique</h2>
      <div id="history-list">
        <p class="empty-state">Aucune analyse pour le moment</p>
      </div>
      <button id="clear-history" class="btn-secondary">Effacer l'historique</button>
    </div>

    <div class="popup-footer">
      <p>ByteForge 2026 · ESIP Gafsa</p>
      <p class="disclaimer">⚠️ Résultats probabilistes</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
